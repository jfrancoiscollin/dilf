name: mtdp-fixed-successor-audit
on:
  push:
    branches: [research/mtdp-foundation]
    paths:
      - .github/workflows/mtdp-fixed-successor-audit.yml
      - research/mtdp/fixed_successor_audit.py
      - research/mtdp/jass_preflight/successor_catalogue.cpp
      - research/mtdp/jass_preflight/successor-targets.cmake
      - research/mtdp/tests/test_fixed_successor_audit.py
      - research/mtdp/validation/fixed-successor-audit-2026-11-26.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtdp-fixed-successor-audit
  cancel-in-progress: false
jobs:
  fixed-typed-occupancy-and-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fmjd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/draught-master
          ref: 0e5189fbb251bf5eaf2e613d0f878bb17c740311
          path: fmjd
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/jass
          ref: cfe07fce6385b980553a898e9651d53419589ebc
          path: jass
      - name: Build isolated successor and unchanged legal exporters
        run: |
          cmake -S jass -B /tmp/mtdp-successor-build -DCMAKE_BUILD_TYPE=Release \
            -DJASS_ENABLE_SIMD=OFF -DJASS_NATIVE=OFF \
            -DCMAKE_PROJECT_jass_INCLUDE="$GITHUB_WORKSPACE/research/mtdp/jass_preflight/successor-targets.cmake"
          cmake --build /tmp/mtdp-successor-build --target mtdp_jass_successor_catalogue mtdp_jass_legal_catalogue -j 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parser, path multiplicity, manual expectation and correction tests
        run: |
          python -m unittest research.mtdp.tests.test_fixed_successor_audit research.mtdp.tests.test_return_capture_oracle research.mtdp.tests.test_king_origin_correction
      - name: Reproduce fixed successors without search or scores
        run: |
          mkdir -p .cache/mtdp
          PYTHONHASHSEED=731 python -m research.mtdp.fixed_successor_audit \
            --root . --adapter fmjd --jass jass \
            --successor-executable /tmp/mtdp-successor-build/mtdp_jass_successor_catalogue \
            --legal-executable /tmp/mtdp-successor-build/mtdp_jass_legal_catalogue \
            --output-dir .cache/mtdp/fixed-successors
          cmp .cache/mtdp/fixed-successors/fixed-successor-audit.json research/mtdp/validation/fixed-successor-audit-2026-11-26.json
          c++ --version > .cache/mtdp/fixed-successors/compiler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtdp-fixed-successor-audit
          path: .cache/mtdp/fixed-successors/
          if-no-files-found: error
          retention-days: 30
