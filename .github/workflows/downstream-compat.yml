name: downstream-compat

# Runs draught-master's pedagogy tests against the current dilf ref.
# Protects the contract documented in INTEROP.md: if any dilf change
# breaks the consumer's tests, this job fails and the PR cannot merge.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  draught-master-pedagogy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dilf (PR ref)
        uses: actions/checkout@v4
        with:
          path: dilf

      - name: Check out draught-master:develop
        uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/draught-master
          ref: develop
          path: draught-master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dilf from the PR ref (editable)
        run: pip install -e "./dilf[dev,extract,explanations]"

      - name: Install draught-master runtime + dev deps
        run: |
          # Remove the dilf pin from requirements.txt so pip doesn't
          # overwrite our editable install with main-tarball dilf.
          sed -i '/dilf/d' draught-master/backend/requirements.txt
          pip install -r draught-master/backend/requirements.txt
          pip install -r draught-master/requirements-dev.txt

      - name: Run draught-master pedagogy tests against this dilf
        working-directory: draught-master
        run: pytest backend/tests/test_pedagogy_storage.py backend/tests/test_pedagogy_api.py backend/tests/test_tag_existing_exercises.py -q

      - name: Run draught-master dilf-imports smoke test (if present)
        working-directory: draught-master
        run: |
          if [ -f backend/tests/test_dilf_imports.py ]; then
            pytest backend/tests/test_dilf_imports.py -q
          else
            echo "test_dilf_imports.py not yet present in draught-master — skipping"
          fi

      - name: dilf public API snapshot (sanity)
        run: pytest dilf/pedagogy/tests/test_public_api.py -q

      - name: MTDP replay of PC Blues with real FMJD rules
        env:
          PYTHONPATH: ${{ github.workspace }}/dilf:${{ github.workspace }}/draught-master
        run: |
          python -m research.mtdp.trajectories \
            --engine-factory research.mtdp.draught_master_adapter:create_engine \
            --pdn dilf/data/exports/pcblues/pcblues_games.pdn \
            --output /tmp/mtdp-trajectories.jsonl \
            --quarantine /tmp/mtdp-quarantine.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from research.mtdp.pdn import read_games
          games = read_games(Path("dilf/data/exports/pcblues/pcblues_games.pdn"))
          rows = [json.loads(line) for line in Path("/tmp/mtdp-trajectories.jsonl").read_text().splitlines()]
          errors = [json.loads(line) for line in Path("/tmp/mtdp-quarantine.jsonl").read_text().splitlines()]
          print(f"Parsed games: {len(games)}; accepted: {len(games)-len(errors)}; positions: {len(rows)}")
          if errors:
              print("Quarantined games:", json.dumps(errors, ensure_ascii=False, indent=2))
          assert len(games) == 26, "Unexpected PC Blues corpus size"
          assert not errors, "FMJD replay failed; inspect quarantine output above"
          assert len({r["source_id"] for r in rows}) == 26
          PY

      - name: MTDP spatial dynamics descriptive report
        env:
          PYTHONPATH: ${{ github.workspace }}/dilf:${{ github.workspace }}/draught-master
        run: |
          python -m research.mtdp.spatial_dynamics \
            /tmp/mtdp-trajectories.jsonl \
            --output /tmp/mtdp-spatial-dynamics.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/mtdp-spatial-dynamics.json").read_text())
          assert report["games"] == 26, "Expected all 26 validated games"
          assert report["transitions"] > 0, "No trajectory transitions analyzed"
          assert report["positions"] == report["transitions"] + report["games"]
          print(json.dumps({
              key: report[key] for key in (
                  "schema_version", "games", "positions", "transitions",
                  "revisited_exact_positions_within_games",
                  "unchanged_descriptors_transitions",
                  "descriptor_change_counts", "mean_absolute_ply_change"
              )
          }, sort_keys=True, indent=2))
          PY

      - name: MTDP coarse-signature collision audit
        env:
          PYTHONPATH: ${{ github.workspace }}/dilf:${{ github.workspace }}/draught-master
        run: |
          python -m research.mtdp.signature_collisions \
            /tmp/mtdp-trajectories.jsonl \
            --output /tmp/mtdp-signature-collisions.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/mtdp-signature-collisions.json").read_text())
          assert report["games"] == 26
          assert report["observations"] == 1864
          assert report["distinct_signatures"] <= report["distinct_fens"] <= report["observations"]
          print(json.dumps(report, sort_keys=True, indent=2))
          PY

      - name: MTDP side-to-move collision control
        env:
          PYTHONPATH: ${{ github.workspace }}/dilf:${{ github.workspace }}/draught-master
        run: |
          python -m research.mtdp.turn_control \
            /tmp/mtdp-trajectories.jsonl \
            --output /tmp/mtdp-turn-control.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/mtdp-turn-control.json").read_text())
          assert report["games"] == 26
          assert report["observations"] == 1864
          assert report["turn_conditioned_signatures"] >= report["coarse_signatures"]
          assert report["turn_conditioned_collision_groups"] <= report["turn_conditioned_signatures"]
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Archive MTDP research results
        uses: actions/upload-artifact@v4
        with:
          name: mtdp-pcblues-spatial-dynamics
          path: |
            /tmp/mtdp-spatial-dynamics.json
            /tmp/mtdp-signature-collisions.json
            /tmp/mtdp-turn-control.json
            /tmp/mtdp-quarantine.jsonl
          retention-days: 30
          if-no-files-found: error
