name: mtdp-king-origin-v1-regression
on:
  push:
    branches: [research/mtdp-foundation]
    paths:
      - .github/workflows/mtdp-king-origin-v1-regression.yml
      - research/mtdp/king_origin_correction.py
      - research/mtdp/king_origin_regression.py
      - research/mtdp/return_capture_oracle.py
      - research/mtdp/tests/test_king_origin_correction.py
      - research/mtdp/validation/king-origin-v1-regression-2026-11-26.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtdp-king-origin-v1-regression
  cancel-in-progress: false
jobs:
  explicit-research-correction-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fmjd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/draught-master
          ref: 0e5189fbb251bf5eaf2e613d0f878bb17c740311
          path: fmjd
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/jass
          ref: cfe07fce6385b980553a898e9651d53419589ebc
          path: jass
      - name: Build unchanged legal-only reference exporter
        run: |
          cmake -S jass -B /tmp/mtdp-king-origin-build -DCMAKE_BUILD_TYPE=Release \
            -DJASS_ENABLE_SIMD=OFF -DJASS_NATIVE=OFF \
            -DCMAKE_PROJECT_jass_INCLUDE="$GITHUB_WORKSPACE/research/mtdp/jass_preflight/targets.cmake"
          cmake --build /tmp/mtdp-king-origin-build --target mtdp_jass_legal_catalogue -j 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check isolated correction and all eight fixed legal catalogues
        run: |
          python -m unittest research.mtdp.tests.test_king_origin_correction research.mtdp.tests.test_return_capture_oracle
          mkdir -p .cache/mtdp
          python -m research.mtdp.king_origin_regression --adapter fmjd --jass jass \
            --executable /tmp/mtdp-king-origin-build/mtdp_jass_legal_catalogue \
            --output .cache/mtdp/king-origin-v1-regression.json \
            --provenance .cache/mtdp/king-origin-v1-provenance.json \
            --raw-catalogue .cache/mtdp/king-origin-v1-jass-catalogue.txt
          cmp .cache/mtdp/king-origin-v1-regression.json research/mtdp/validation/king-origin-v1-regression-2026-11-26.json
          c++ --version > .cache/mtdp/compiler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtdp-king-origin-v1-regression
          path: .cache/mtdp/
          if-no-files-found: error
          retention-days: 30
