name: Extract diagrams (Claude Vision)

# GitOps wrapper around `scripts/extract_diagrams.py`. Runs on a GitHub
# Actions runner (which has both internet and access to ANTHROPIC_API_KEY)
# and opens a pull request with the generated fixtures so a human can spot
# check the extractions before merging.
#
# Prerequisites:
#   1. Add a repository secret named ANTHROPIC_API_KEY
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#   2. The source PDF must live on the `main` branch; the workflow fetches
#      it temporarily into the runner's workspace and never commits it.

on:
  workflow_dispatch:
    inputs:
      pdf:
        description: 'PDF filename on main (e.g. jpdubois_perfectionnement_combinaisons_V4.pdf)'
        required: true
        default: 'jpdubois_perfectionnement_combinaisons_V4.pdf'
      pages:
        description: 'Pages to scan ("all", "5-90", "5,7,10")'
        required: true
        default: '5-90'
      max_diagrams:
        description: 'Cap on diagrams sent to the API (0 = no cap)'
        required: false
        default: '0'
      model:
        description: 'Claude model id (default: claude-haiku-4-5)'
        required: false
        default: 'claude-haiku-4-5'
      target_branch:
        description: 'Branch the PR will target'
        required: true
        default: 'claude/read-spec-start-Ai5jV'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: extract-diagrams-${{ github.event.inputs.pdf }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Fetch source PDF from main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git show "origin/main:${PDF}" > /dev/null 2>&1; then
            echo "::error::PDF '${PDF}' not found on origin/main"
            exit 1
          fi
          git show "origin/main:${PDF}" > "${PDF}"
          ls -la "${PDF}"
        env:
          PDF: ${{ github.event.inputs.pdf }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[extract]"

      - name: Restore diagram cache
        uses: actions/cache@v4
        with:
          path: .cache/diagrams
          key: dubois-extract-${{ github.event.inputs.pdf }}-${{ github.event.inputs.pages }}-${{ github.event.inputs.model }}-${{ hashFiles('scripts/extract_diagrams.py') }}
          restore-keys: |
            dubois-extract-${{ github.event.inputs.pdf }}-${{ github.event.inputs.model }}-${{ hashFiles('scripts/extract_diagrams.py') }}-
          save-always: true

      - name: Run extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m scripts.extract_diagrams all \
            --pdf "${{ github.event.inputs.pdf }}" \
            --pages "${{ github.event.inputs.pages }}" \
            --max-diagrams "${{ github.event.inputs.max_diagrams }}" \
            --model "${{ github.event.inputs.model }}" \
            --verbose

      - name: Summarise results
        if: always()
        run: |
          if [ ! -f .cache/diagrams/extracted.json ]; then
            echo "No extracted.json produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path('.cache/diagrams/extracted.json').read_text())
          ok = [e for e in data if not e.get('error')]
          ko = [e for e in data if e.get('error')]
          ti = sum(e.get('input_tokens', 0) for e in data)
          to = sum(e.get('output_tokens', 0) for e in data)
          print('## Extraction summary')
          print('')
          print(f'- Total diagrams: **{len(data)}**')
          print(f'- Successful: **{len(ok)}**')
          print(f'- Errors: **{len(ko)}**')
          print(f'- Tokens: input={ti}, output={to}')
          print('')
          if ko:
              print('### Errors')
              print('')
              for e in ko[:20]:
                  print(f"- `{e['crop_id']}`: {e['error']}")
          PY

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubois-extract-${{ github.run_id }}
          path: |
            .cache/diagrams/extracted.json
            .cache/diagrams/crops.json
          retention-days: 30

      - name: Drop fetched PDF before committing
        run: rm -f "${{ github.event.inputs.pdf }}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.event.inputs.target_branch }}
          branch: dubois-extract/run-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            pedagogy/tests/fixtures/dubois_diagrams.py
          commit-message: |
            chore(dubois): extract diagrams via Claude Vision

            PDF: ${{ github.event.inputs.pdf }}
            Pages: ${{ github.event.inputs.pages }}
            Model: ${{ github.event.inputs.model }}
            Run: ${{ github.run_id }}
          title: 'Dubois diagrams from ${{ github.event.inputs.pdf }} (run ${{ github.run_id }})'
          body: |
            Auto-generated by `.github/workflows/extract-diagrams.yml`.

            ### Inputs
            - PDF: `${{ github.event.inputs.pdf }}`
            - Pages: `${{ github.event.inputs.pages }}`
            - Model: `${{ github.event.inputs.model }}`
            - Max diagrams: `${{ github.event.inputs.max_diagrams }}`
            - Target branch: `${{ github.event.inputs.target_branch }}`

            ### Outputs
            - `pedagogy/tests/fixtures/dubois_diagrams.py` (regenerated).
            - Workflow artifact `dubois-extract-${{ github.run_id }}` retains
              `extracted.json` + `crops.json` for 30 days.

            ### Review checklist
            - [ ] Spot-check 3-5 diagrams against the source PDF.
            - [ ] No square appears in more than one piece list (validated automatically).
            - [ ] Token usage and cost are within budget (see job summary).
          labels: dubois-extraction
