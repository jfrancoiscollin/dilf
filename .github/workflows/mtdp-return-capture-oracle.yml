name: mtdp-return-capture-oracle
on:
  push:
    branches: [research/mtdp-foundation]
    paths:
      - .github/workflows/mtdp-return-capture-oracle.yml
      - research/mtdp/return_capture_oracle.py
      - research/mtdp/tests/test_return_capture_oracle.py
      - research/mtdp/validation/return-capture-oracle-2026-11-26.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtdp-return-capture-oracle
  cancel-in-progress: false
jobs:
  legal-catalogues-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fmjd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/draught-master
          ref: 0e5189fbb251bf5eaf2e613d0f878bb17c740311
          path: fmjd
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/jass
          ref: cfe07fce6385b980553a898e9651d53419589ebc
          path: jass
      - name: Build existing legal-only exporter
        run: |
          cmake -S jass -B /tmp/mtdp-return-build -DCMAKE_BUILD_TYPE=Release \
            -DJASS_ENABLE_SIMD=OFF -DJASS_NATIVE=OFF \
            -DCMAKE_PROJECT_jass_INCLUDE="$GITHUB_WORKSPACE/research/mtdp/jass_preflight/targets.cmake"
          cmake --build /tmp/mtdp-return-build --target mtdp_jass_legal_catalogue -j 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare fixed catalogues without search or scores
        run: |
          python -m unittest research.mtdp.tests.test_return_capture_oracle
          mkdir -p .cache/mtdp
          python -m research.mtdp.return_capture_oracle --root . --adapter fmjd --jass jass \
            --executable /tmp/mtdp-return-build/mtdp_jass_legal_catalogue \
            --output .cache/mtdp/return-capture-oracle.json \
            --provenance .cache/mtdp/return-capture-oracle-provenance.json \
            --raw-catalogue .cache/mtdp/return-capture-jass-catalogue.txt
          cmp .cache/mtdp/return-capture-oracle.json research/mtdp/validation/return-capture-oracle-2026-11-26.json
          c++ --version > .cache/mtdp/compiler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtdp-return-capture-oracle
          path: .cache/mtdp/
          if-no-files-found: error
          retention-days: 30
