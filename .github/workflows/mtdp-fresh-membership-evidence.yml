name: mtdp-fresh-membership-evidence
on:
  push:
    branches: [research/mtdp-foundation]
    paths:
      - .github/workflows/mtdp-fresh-membership-evidence.yml
      - research/mtdp/fresh_membership_evidence.py
      - research/mtdp/tests/test_fresh_membership_evidence.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtdp-fresh-membership-evidence
  cancel-in-progress: false
jobs:
  source-links-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test scoped identity parser
        run: python -m unittest research.mtdp.tests.test_fresh_membership_evidence
      - name: Resume bounded membership capture without repeating six observed pages
        run: |
          python -m zipfile -e research/mtdp/fresh_intake/2026-11-25-uDIrrl1c-membership-seed.zip membership
          python -m research.mtdp.fresh_membership_evidence capture \
            --archive research/mtdp/fresh_intake/2026-11-25-uDIrrl1c.zip --evidence membership
          # Store flat archive names for the offline verifier.
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('membership-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('membership').iterdir()):
                  z.write(p,p.name)
          PY
          python -m research.mtdp.fresh_membership_evidence audit \
            --archive research/mtdp/fresh_intake/2026-11-25-uDIrrl1c.zip \
            --evidence membership-evidence.zip --output membership-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtdp-fresh-uDIrrl1c-membership-evidence
          path: |
            membership-evidence.zip
            membership-report.json
            membership/receipt.json
          if-no-files-found: error
          retention-days: 30
