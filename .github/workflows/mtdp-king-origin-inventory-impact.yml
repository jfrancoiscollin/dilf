name: mtdp-king-origin-inventory-impact
on:
  push:
    branches: [research/mtdp-foundation]
    paths:
      - .github/workflows/mtdp-king-origin-inventory-impact.yml
      - research/mtdp/king_origin_inventory_impact.py
      - research/mtdp/king_origin_correction.py
      - research/mtdp/tests/test_king_origin_inventory_impact.py
      - research/mtdp/validation/king-origin-inventory-impact-2026-11-26.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mtdp-king-origin-inventory-impact
  cancel-in-progress: false
jobs:
  bounded-legality-impact-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fmjd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/draught-master
          ref: 0e5189fbb251bf5eaf2e613d0f878bb17c740311
          path: fmjd
      - uses: actions/checkout@v4
        with:
          repository: jfrancoiscollin/jass
          ref: cfe07fce6385b980553a898e9651d53419589ebc
          path: jass
      - uses: actions/download-artifact@v4
        with:
          name: mtdp-historical-base-frontier
          run-id: 45741874083
          github-token: ${{ github.token }}
          path: historical-input
      - uses: actions/download-artifact@v4
        with:
          name: mtdp-fresh-uDIrrl1c-position-footprint
          run-id: 45720526966
          github-token: ${{ github.token }}
          path: fresh-input
      - name: Build unchanged legal-only exporter
        run: |
          cmake -S jass -B /tmp/mtdp-king-impact-build -DCMAKE_BUILD_TYPE=Release \
            -DJASS_ENABLE_SIMD=OFF -DJASS_NATIVE=OFF \
            -DCMAKE_PROJECT_jass_INCLUDE="$GITHUB_WORKSPACE/research/mtdp/jass_preflight/targets.cmake"
          cmake --build /tmp/mtdp-king-impact-build --target mtdp_jass_legal_catalogue -j 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare complete fixed inventory union without scoring
        run: |
          python -m unittest research.mtdp.tests.test_king_origin_inventory_impact research.mtdp.tests.test_king_origin_correction research.mtdp.tests.test_return_capture_oracle
          mkdir -p .cache/mtdp
          timeout 600s python -m research.mtdp.king_origin_inventory_impact \
            --historical historical-input/combined-190-possible-board-inventory.jsonl \
            --fresh fresh-input/fresh-position-inventory.jsonl \
            --adapter fmjd --jass jass --executable /tmp/mtdp-king-impact-build/mtdp_jass_legal_catalogue \
            --output-dir .cache/mtdp/king-impact
          cmp .cache/mtdp/king-impact/king-origin-impact.json research/mtdp/validation/king-origin-inventory-impact-2026-11-26.json
          c++ --version > .cache/mtdp/king-impact/compiler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtdp-king-origin-inventory-impact
          path: .cache/mtdp/king-impact/
          if-no-files-found: error
          retention-days: 30
