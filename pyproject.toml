[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dilf"
version = "0.1.0"
description = "Draught Intelligence Learning Framework — deterministic pedagogy module for international draughts (FMJD 10x10)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "dilf contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]
extract = [
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
]
explanations = [
    "scikit-learn>=1.4",
    "anthropic>=0.34",
]

[tool.setuptools.packages.find]
include = ["pedagogy*"]
exclude = ["pedagogy.tests*"]

[tool.pytest.ini_options]
testpaths = ["pedagogy/tests", "scripts/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pedagogy"]
exclude = ["pedagogy/tests/.*"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
